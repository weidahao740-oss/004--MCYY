<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morrow 首日体验流程原型</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23263747'/%3E%3Cpath d='M16 44V20l16 15 16-15v24' fill='none' stroke='%23D8B66C' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--ink:#24312c;--muted:#69756f;--paper:#eef2ed;--panel:#fbfcf9;--line:#cbd5ce;--moss:#416a55;--moss2:#dce8df;--amber:#bd8d41;--amber2:#f3e8cf;--night:#263747;--danger:#9b4d4d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei UI",sans-serif}.app{max-width:1120px;margin:0 auto;padding:28px 22px 42px}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}.top h1{font-size:clamp(25px,4vw,44px);line-height:1.08;margin:0 0 8px;letter-spacing:-.04em}.top p{margin:0;color:var(--muted);font-size:14px}.meta{font-size:13px;color:var(--moss);text-align:right}.progress{display:grid;grid-template-columns:repeat(8,1fr);gap:0;margin:28px 0 20px}.step{position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:26px}.step:before{content:"";position:absolute;top:8px;left:50%;width:10px;height:10px;border:2px solid var(--line);background:var(--paper);transform:translateX(-50%) rotate(45deg);z-index:2}.step:after{content:"";position:absolute;height:1px;background:var(--line);top:14px;left:0;right:0;z-index:1}.step:first-child:after{left:50%}.step:last-child:after{right:50%}.step.active{color:var(--ink);font-weight:700}.step.active:before{background:var(--amber);border-color:var(--amber)}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:18px}.screen,.detail{background:var(--panel);border:1px solid var(--line)}.screen{min-height:500px;position:relative;overflow:visible}.room{padding:28px;min-height:500px;background:linear-gradient(180deg,#dce4e5 0%,#f7f8f4 70%);display:flex;flex-direction:column}.room:before{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-60px;border:1px solid rgba(65,106,85,.25);border-radius:50%}.scene-label{font-size:12px;color:var(--moss);letter-spacing:.08em}.dialogue{margin-top:auto;max-width:680px}.morrow{width:84px;height:72px;margin-bottom:18px;position:relative}.morrow .body{position:absolute;bottom:0;width:72px;height:54px;background:var(--night);border-radius:48% 52% 42% 45%}.morrow .ear1,.morrow .ear2{position:absolute;top:0;width:25px;height:38px;background:var(--night);clip-path:polygon(50% 0,100% 100%,0 100%)}.morrow .ear1{left:8px;transform:rotate(-10deg)}.morrow .ear2{left:42px;transform:rotate(12deg)}.morrow .eye{position:absolute;bottom:26px;width:7px;height:7px;background:#d8b66c;border-radius:50%;z-index:2}.morrow .e1{left:22px}.morrow .e2{left:45px}.speech{font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,2.4vw,29px);line-height:1.4;max-width:640px;margin-bottom:19px}.helper{color:var(--muted);font-size:14px;margin-bottom:18px}.actions{display:flex;flex-wrap:wrap;gap:9px}.actions button,.nav button{border:1px solid var(--moss);background:transparent;color:var(--moss);padding:10px 14px;min-height:44px;font:inherit;cursor:pointer}.actions button.primary,.nav button.primary{background:var(--moss);color:white}.actions button:focus-visible,.nav button:focus-visible{outline:3px solid var(--amber2);outline-offset:2px}.detail{padding:22px}.detail h2{font-size:19px;margin:0 0 12px}.detail dl{margin:0}.detail dt{font-weight:700;font-size:13px;margin-top:15px}.detail dd{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.55}.rule{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;line-height:1.55}.rule b{color:var(--moss)}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.legend{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.legend div{border-top:3px solid var(--line);padding-top:9px;font-size:13px;color:var(--muted)}.legend .value{border-color:var(--moss)}.legend .memory{border-color:var(--amber)}.legend .recovery{border-color:var(--danger)}
@media(max-width:760px){.app{padding:20px 14px 32px}.top{grid-template-columns:1fr}.meta{font-size:14px;text-align:left}.progress{overflow-x:auto;grid-template-columns:repeat(8,95px);padding-bottom:7px}.step{font-size:14px}.layout{grid-template-columns:1fr}.screen,.room{min-height:430px}.scene-label{font-size:14px}.detail{min-height:280px}.rule,.legend div{font-size:14px}.legend{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><h1>Morrow 首日体验</h1><p>低保真流程原型 · 点击步骤查看用户界面与后台规则</p></div><div class="meta">first-day-1.0<br>3—5 分钟</div></header>
<div class="progress" id="progress"></div>
<div class="layout">
<section class="screen" aria-live="polite"><div class="room"><div class="scene-label" id="sceneLabel"></div><div class="dialogue"><div class="morrow" aria-label="Morrow 轮廓"><span class="ear1"></span><span class="ear2"></span><span class="body"></span><span class="eye e1"></span><span class="eye e2"></span></div><div class="speech" id="speech"></div><div class="helper" id="helper"></div><div class="actions" id="actions"></div></div></div></section>
<aside class="detail"><h2 id="detailTitle"></h2><dl><dt>用户任务</dt><dd id="task"></dd><dt>系统写入</dt><dd id="write"></dd><dt>失败恢复</dt><dd id="recovery"></dd></dl><div class="rule"><b>首日原则</b><br><span id="rule"></span></div></aside>
</div>
<div class="nav"><button id="prev">上一步</button><button class="primary" id="next">下一步</button></div>
<div class="legend"><div class="value">价值：先让用户被理解</div><div class="memory">记忆：用户确认后才保存</div><div class="recovery">恢复：异常不推进状态</div></div>
</div>
<script>
const steps=[
{key:'FD00',name:'进入',label:'听见声音',speech:'房间里有一个微弱的声音。',helper:'首次不自动播放音频。用户可以选择聆听声音或仅用文字。',actions:['聆听声音','仅用文字'],task:'选择语音或纯文字开始体验，不注册、不授权麦克风。',write:'创建访客会话；记录语音输出偏好。',recovery:'TTS 失败时直接显示文字，主流程继续。',rule:'先触发好奇心，不在价值体验前索取账号和个人信息。'},
{key:'FD01',name:'相遇',label:'Morrow 醒来',speech:'Hello? I can hear you, but the room is still quiet. I’m Morrow.',helper:'可重听、慢速播放或换成更简单的英语。',actions:['继续','重听','慢一点','简单英语'],task:'理解 Morrow 的基本处境，不必立即开口。',write:'状态推进至 FD02_NAME。',recovery:'声音不可用时使用字幕；不阻塞继续。',rule:'第一段听力必须短，先建立角色，不一次讲完整世界观。'},
{key:'FD02',name:'称呼',label:'第一次安全表达',speech:'What should I call you?',helper:'输入昵称、按住说话，或选择暂不提供。',actions:['输入名字','按住说话','暂不提供'],task:'提供称呼或明确跳过。',write:'称呼只进入当前会话和待确认记忆队列。',recovery:'拒绝麦克风后保留文字与跳过路径。',rule:'姓名不是进入产品的门槛，也不能未经确认直接成为长期记忆。'},
{key:'FD03',name:'今天',label:'第一次真实表达',speech:'Before we fix the room, tell me one small thing about today.',helper:'参考句：Today was busy. / I’m a little tired today。也可自由输入。',actions:['打字','参考句','按住说话'],task:'用至少一句英语表达今天的一件小事。',write:'保存已确认的用户消息；生成意图理解，不立即写长期记忆。',recovery:'歧义时只问一个澄清问题；最多两轮后提供参考句。',rule:'意思清楚就继续，不在对话中打断纠错。'},
{key:'FD04',name:'理解',label:'确认 Morrow 听懂了',speech:'I understood: You felt tired because work was too busy today.',helper:'用户决定理解是否正确。',actions:['对，就是这样','不太对','修改我的句子'],task:'确认或修正 Morrow 对自己意思的理解。',write:'确认后记录 communication_success；形成生活记忆提案。',recovery:'修正后重新确认；ASR 原始错误文本不进入记忆。',rule:'“被理解”是首日最重要的价值时刻，先于任何评分。'},
{key:'FD05',name:'恢复',label:'英语改变世界',speech:'The room remembers a lamp, a plant, and a small bell. Which one should we bring back?',helper:'选择窗边的灯、门边的植物或小铃铛，并用英语确认。',actions:['灯','植物','小铃铛','用英语说出我的选择'],task:'通过英语作出会改变房间的选择。',write:'写入确定性世界状态 first_restored_object。',recovery:'对象不清楚时复述确认；不扣分、不让房间变暗。',rule:'世界结果与个人记忆分离；拒绝保存个人信息不撤销选择。'},
{key:'FD06',name:'审核',label:'决定留下什么',speech:'I can remember a few things from tonight, but only if you want me to.',helper:'逐条保存、编辑或不保存生活、语言与关系记忆。',actions:['保存','编辑','不保存'],task:'明确处理每条记忆提案，并决定是否登录同步。',write:'只有用户保存后的提案转为 confirmed；其余不得进入 ACTIVE_MEMORIES。',recovery:'登录失败时保留本机数据；记忆失败可重试或放弃。',rule:'系统负责提出，用户负责决定。默认未选择，不预勾选。'},
{key:'FD07',name:'记忆册',label:'第一篇共同记忆',speech:'That is enough for our first night. The room will still be here when you return.',helper:'查看表达、世界变化和已保存记忆；不出现打卡倒计时。',actions:['回到房间','回顾已保存记忆','先到这里'],task:'查看结果并自然结束，或进入房间。',write:'first_day_status=completed；生成 journal_entry_id。',recovery:'即使拒绝全部个人记忆，也可生成只含世界变化的日记。',rule:'结束意味着闭环完成，不用奖励和负罪感要求用户第二天回来。'}
];
let index=0;
const q=id=>document.getElementById(id);
function render(){const s=steps[index];q('progress').innerHTML=steps.map((x,i)=>`<button class="step ${i===index?'active':''}" data-i="${i}" aria-label="查看${x.name}">${x.name}</button>`).join('');q('sceneLabel').textContent=`${s.key} · ${s.label}`;q('speech').textContent=s.speech;q('helper').textContent=s.helper;q('actions').innerHTML=s.actions.map((a,i)=>`<button class="${i===0?'primary':''}" data-action="${a}">${a}</button>`).join('');q('detailTitle').textContent=`${index+1}. ${s.label}`;q('task').textContent=s.task;q('write').textContent=s.write;q('recovery').textContent=s.recovery;q('rule').textContent=s.rule;q('prev').disabled=index===0;q('next').textContent=index===steps.length-1?'回到开始':'下一步';document.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{index=Number(b.dataset.i);render()}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{q('helper').textContent=`原型反馈：已选择 “${b.dataset.action}”。真实产品将在此推进对应状态。`}));}
q('prev').addEventListener('click',()=>{if(index>0){index--;render()}});q('next').addEventListener('click',()=>{index=index===steps.length-1?0:index+1;render()});render();
</script>
</body>
</html>
